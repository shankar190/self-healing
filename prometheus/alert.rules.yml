groups:

- name: LinuxAlerts

  rules:

  - alert: HighCPUUsage

    expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 90

    for: 30s

    labels:
      severity: critical

    annotations:

      summary: CPU usage is above 90%

  - alert: NodeDown

    expr: up == 0

    for: 30s

    labels:

      severity: critical

    annotations:

      summary: Instance Down
